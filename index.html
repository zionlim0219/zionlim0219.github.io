<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bumpin' — Brat Mode</title>
  <style>
    body {
      margin: 0;
      background-color: #D1FF00; /* brat green */
      font-family: Arial, sans-serif;
      font-stretch: condensed; /* fallback */
      transform: scaleY(1.08); /* vertical distortion */
      transform-origin: top;
      color: black;
      text-align: center;
      overflow: hidden;
    }

    .lyrics {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2.2rem;
      line-height: 1.1;
      text-transform: lowercase;
      animation: fade 1s ease-in-out;
    }

    @keyframes fade {
      0% { opacity: 0; transform: translate(-50%, -45%); }
      10% { opacity: 1; transform: translate(-50%, -50%); }
      90% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -55%); }
    }
  </style>
</head>
<body>
  <div class="lyrics" id="lyrics"></div>

  <script>
    // approximate lyric timing (in seconds)
    const timedLyrics = [
      [0, "bumpin' that, bumpin' that, bumpin' that, bumpin' that"],
      [4, "okay, okay"],
      [6, "here we go"],
      [8, "when i'm in the club, yeah, i'm bumpin' that"],
      [12, "when i'm at the house, yeah, i'm bumpin' that"],
      [16, "365, party girl, bumpin' that"],
      [20, "should we do a little key?"],
      [23, "should we have a little line?"],
      [26, "wanna go real wild when i'm bumpin' that"],
      [30, "meet me in the bathroom if you're bumpin' that"],
      [34, "french manicure, wipe away the residue"],
      [38, "push my hair back, i look hot when i'm bumpin' that"],
      [42, "no, i really don't stop when i'm bumpin' that"],
      [46, "dial 999, it's a good time"],
      [50, "who the fuck are you? i'm a brat when i'm bumpin' that"],
      [55, "now i wanna hear my track — are you bumpin' that?"],
      [59, "til the windows crack, i'll be bumpin' that"],
      [64, "no, i never go home, don't sleep, don't eat"],
      [68, "just do it on repeat, keep bumpin' that"],
      [72, "keep bumpin' that"],
      [75, "keep bumpin' that"],
      [78, "keep bumpin' that"],
      [81, "keep bumpin' that"],
      [85, "keep bumpin' that"],
      [88, "keep bumpin' that"],
      [91, "keep bumpin' that"],
      [94, "keep bumpin' that"],
    ];

    const display = document.getElementById('lyrics');

    function showLine(line) {
      display.textContent = line;
      display.style.animation = 'none';
      void display.offsetWidth; // reset animation
      display.style.animation = 'fade 1s ease-in-out';
    }

    // sync based on real-time
    timedLyrics.forEach(([time, text]) => {
      setTimeout(() => showLine(text), time * 1000);
    });
  </script>
</body>
</html>
