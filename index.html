<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bumpin' that — brat mode</title>
<style>
  body {
    margin: 0;
    background-color: #8ACE00;
    font-family: Arial, sans-serif;
    overflow: hidden;
    position: relative;
    height: 100vh;
    width: 100vw;
  }

  /* ===== TYPOGRAPHIC SCALE SECTION (Major Third) ===== */
  .text-container {
    position: absolute;
    top: 60px;
    left: 70px;
    text-align: left;
    max-width: 600px;
    color: black;
    z-index: 10;
    animation: fadeIn 1.5s ease forwards;
  }

  .main-title {
    font-size: 3rem; /* Major Third scale */
    font-weight: 900;
    letter-spacing: -0.03em;
    text-transform: lowercase;
    margin-bottom: 0.4em;
  }

  .subheader {
    font-size: 2.4rem; /* Next step down */
    font-weight: 600;
    text-transform: lowercase;
    margin-bottom: 0.6em;
  }

  .body-text {
    font-size: 1.2rem; /* Base step */
    line-height: 1.6;
    font-weight: 400;
    max-width: 520px;
  }

  /* ===== ORIGINAL ANIMATIONS + FLOAT ELEMENTS ===== */
  .lyric {
    position: absolute;
    color: black;
    font-size: 22px;
    font-weight: bold;
    text-transform: lowercase;
    transform: scaleY(1.10); 
    letter-spacing: -0.02em;
    opacity: 0;
    animation: fadeIn 1.2s ease forwards, subtleJitter 2s infinite ease-in-out alternate;
    pointer-events: none;
  }

  .image {
    position: absolute;
    width: 140px;
    height: 140px;
    object-fit: cover;
    border-radius: 8px;
    opacity: 0;
    animation: fadeIn 1.5s ease forwards, slowDrift 6s infinite ease-in-out alternate;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scaleY(0.88) translateY(10px); }
    to { opacity: 1; transform: scaleY(0.88) translateY(0); }
  }

  @keyframes subtleJitter {
    0% { transform: scaleY(0.88) translate(0px, 0px); }
    50% { transform: scaleY(0.88) translate(1px, -0.5px); }
    100% { transform: scaleY(0.88) translate(-1px, 0.5px); }
  }

  @keyframes slowDrift {
    0% { transform: translate(0px, 0px); }
    50% { transform: translate(2px, -3px); }
    100% { transform: translate(-2px, 3px); }
  }
</style>
</head>
<body>

<!-- ===== TOP-LEFT HEADER SECTION ===== -->
<div class="text-container">
  <div class="main-title">bumpin’ that</div>
  <div class="subheader">brat mode activated</div>
  <div class="body-text">
    Lorem ipsum dolor sit amet, consectetur adipiscing elit. Duis eget felis eu nunc mattis blandit. Pellentesque ac lacus ac velit pulvinar sagittis. Sed euismod, neque et fringilla sodales, lectus massa viverra sapien, id sagittis turpis enim non arcu.
  </div>
</div>

<!-- ===== FLOATING LYRICS + IMAGES ===== -->
<script>
  const lyrics = [
    "bumpin' that, bumpin' that, bumpin' that, bumpin' that",
    "bumpin' that, bumpin' that, bumpin' that, bumpin' that",
    "okay, okay",
    "okay, okay, okay",
    "here we go",
    "when i'm in the club, yeah, i'm bumpin' that",
    "when i'm at the house, yeah, i'm bumpin' that",
    "365, party girl, bumpin' that",
    "should we do a little key?",
    "should we have a little line?",
    "wanna go real wild when i'm bumpin' that",
    "meet me in the bathroom if you're bumpin' that",
    "365, party girl, bumpin' that",
    "french manicure, wipe away the residue",
    "push my hair back, i look hot when i'm bumpin' that",
    "no, i really don't stop when i'm bumpin' that",
    "gonna jump when it drops when i'm bumpin' that",
    "dial 999, it's a good time",
    "who the fuck are you? i'm a brat when i'm bumpin' that",
    "now i wanna hear my track, are you bumpin' that?",
    "'til the windows crack, i'll be bumpin' that",
    "no, i never go home, don't sleep, don't eat",
    "just do it on repeat, keep bumpin' that",
    "keep bumpin' that",
    "keep bumpin' that",
    "keep",
    "keep bumpin' that",
    "keep bumpin' that",
    "keep bumpin' that",
    "keep",
    "keep bumpin' that",
    "keep bumpin' that",
    "keep bumpin' that",
    "keep",
    "keep bumpin' that",
    "keep bumpin' that",
    "keep bumpin' that"
  ];

  const images = [
    "https://i.pinimg.com/736x/5f/7d/ba/5f7dbafaf9c6f847bdf297203e53fc82.jpg",
    "https://i.pinimg.com/1200x/84/65/60/846560ae39bab06309e1a4a7d55b72ee.jpg",
    "https://i.pinimg.com/736x/8c/e5/38/8ce53858f2a9f52d0c001352cffa7c33.jpg",
    "https://i.pinimg.com/1200x/8b/34/00/8b34009aa8f8d687016637c2aeac955d.jpg",
    "https://i.ytimg.com/vi/mlYQ5LT9C8s/maxresdefault.jpg",
    "https://thefader-res.cloudinary.com/private_images/w_640,c_limit,f_auto,q_auto:eco/Screen_Shot_2018-10-02_at_2.29.39_PM_ohcymn/slayyyter-bff-interview.jpg"
  ];

  let lyricIndex = 0;

  function getRandomPosition(width, height) {
    const padding = 60;
    const x = Math.random() * (window.innerWidth - width - padding);
    const y = Math.random() * (window.innerHeight - height - 160) + 100;
    return { x, y };
  }

  function showLyric() {
    if (lyricIndex >= lyrics.length) return;

    const lyric = document.createElement("div");
    lyric.className = "lyric";
    lyric.textContent = lyrics[lyricIndex];
    document.body.appendChild(lyric);

    const rect = lyric.getBoundingClientRect();
    const { x, y } = getRandomPosition(rect.width, rect.height);
    lyric.style.left = `${x}px`;
    lyric.style.top = `${y}px`;

    lyricIndex++;
    setTimeout(showLyric, 2600);
  }

  function showRandomImage() {
    const img = document.createElement("img");
    img.className = "image";
    img.src = images[Math.floor(Math.random() * images.length)];
    document.body.appendChild(img);

    const { x, y } = getRandomPosition(140, 140);
    img.style.left = `${x}px`;
    img.style.top = `${y}px`;
  }

  window.onload = () => {
    showLyric();
    setInterval(showRandomImage, 6000);
  };
</script>

</body>
</html>
